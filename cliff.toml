# git-cliff: builds CHANGELOG.md and the GitHub Release notes from the conventional commits.
# Every bullet is one commit line, so write commit lines to be read there (see README, "Releases").
#
#   feat       -> Features              (bumps the minor version)
#   fix        -> Bug fixes             (patch)
#   fix(deps)  -> Security and dependencies  (patch)
#   perf       -> Performance           (patch)
#   refactor   -> Refactoring           (patch)
#   revert     -> Reverts               (patch)
#   a "!" after the type, e.g. feat!: or fix(api)!:  -> Breaking changes at the top, and a major bump
#   docs, style, test, chore, ci, build  -> left out of the notes
#
# $REPO is replaced with the repository URL by the postprocessor below.

[changelog]
header = """
# Changelog

All notable changes to this site are documented here. Versions follow [semver](https://semver.org/)
and are worked out from the commits; see the README, "Releases".
"""
body = """
{%- if version %}
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{%- else %}
## [Unreleased]
{%- endif %}
{% set breaking = commits | filter(attribute="breaking", value=true) %}
{%- set regular = commits | filter(attribute="breaking", value=false) %}
{%- if breaking | length > 0 %}
### Breaking changes
{% for commit in breaking %}
- {% if commit.scope %}**{{ commit.scope }}**: {% endif %}{{ commit.message | upper_first }} ([{{ commit.id | truncate(length=7, end="") }}]($REPO/commit/{{ commit.id }}))
{%- endfor %}
{% endif %}
{%- for group, group_commits in regular | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in group_commits %}
- {% if commit.scope %}**{{ commit.scope }}**: {% endif %}{{ commit.message | upper_first }} ([{{ commit.id | truncate(length=7, end="") }}]($REPO/commit/{{ commit.id }}))
{%- endfor %}
{% endfor %}
"""
footer = """

{% for release in releases -%}
{%- if release.version -%}
{%- if release.previous and release.previous.version -%}
[{{ release.version | trim_start_matches(pat="v") }}]: $REPO/compare/{{ release.previous.version }}...{{ release.version }}
{% else -%}
[{{ release.version | trim_start_matches(pat="v") }}]: $REPO/releases/tag/{{ release.version }}
{% endif -%}
{%- else -%}
[Unreleased]: $REPO/compare/{{ release.previous.version }}...HEAD
{% endif -%}
{% endfor %}
"""
trim = true
postprocessors = [
  { pattern = '\$REPO', replace = "https://github.com/arthurgouveia/rthr" },
]

[git]
conventional_commits = true
filter_unconventional = true
# Newest releases first; inside a group, commits in the order they were made.
sort_commits = "oldest"
tag_pattern = "v[0-9].*"
# Order matters: the first parser that matches a commit wins.
commit_parsers = [
  { message = '^chore\(release\)', skip = true },
  { message = '^Merge', skip = true },
  { message = '^feat', group = "<!-- 0 -->Features" },
  { message = '^fix\(deps', group = "<!-- 2 -->Security and dependencies" },
  { message = '^fix', group = "<!-- 1 -->Bug fixes" },
  { message = '^perf', group = "<!-- 3 -->Performance" },
  { message = '^refactor', group = "<!-- 4 -->Refactoring" },
  { message = '^revert', group = "<!-- 5 -->Reverts" },
  { message = '^(docs|style|test|chore|ci|build)', skip = true },
]

[bump]
features_always_bump_minor = true
breaking_always_bump_major = true
initial_tag = "v1.0.0"
