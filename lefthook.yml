pre-commit:
  parallel: true
  commands:
    biome:
      run: npx biome check --write --files-ignore-unknown=true --no-errors-on-unmatched {staged_files}
      stage_fixed: true
      skip_unstaged: true

commit-msg:
  commands:
    commitlint:
      run: npx commitlint --edit "$1"

pre-push:
  commands:
    ci:
      run: npm run ci </dev/null
